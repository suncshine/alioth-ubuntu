# Xiaomi POCO F3 / Redmi K40 (alioth) UCM - speaker + WCD938x microphones
#
# Requires the alioth audio DTB (work/audio/sm8250-xiaomi-alioth-audio.dts):
# it enables the WCD938x codec on SoundWire and the "WCD Capture" DAI link.
#
# Speaker: two CS35L41 amps (RCV/LCV) on Tertiary TDM.
# Mics:    analog mics on the WCD938x, captured through the TX macro
#          (TX_CODEC_DMA_TX_3):
#            main  = ADC1 / AMIC1
#            front = ADC2 / AMIC3 (INP3)
#            back  = ADC3 / AMIC4 (INP4)
#            top   = ADC4 / AMIC5 (INP5)
#          This matches the stock mixer_paths.xml of the device.

SectionVerb {
	EnableSequence [
		cset "name='RCV DSP1 Preload Switch' 1"
		cset "name='RCV DRE Switch' 1"
		cset "name='RCV PCM Soft Ramp' 4ms"
		cset "name='RCV Analog PCM Volume' 18"
		cset "name='RCV ASP TX1 Source' DSPTX1"
		cset "name='RCV DSP RX1 Source' ASPRX1"
		cset "name='RCV DSP RX2 Source' ASPTX2"

		cset "name='LCV DSP1 Preload Switch' 1"
		cset "name='LCV DRE Switch' 1"
		cset "name='LCV PCM Soft Ramp' 4ms"
		cset "name='LCV Analog PCM Volume' 18"
		cset "name='LCV ASP TX1 Source' DSPTX1"
		cset "name='LCV DSP RX1 Source' ASPRX1"
		cset "name='LCV DSP RX2 Source' ASPTX2"

		# playback FE -> Tertiary TDM BE
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		# capture FE -> WCD Capture BE (the four WCD938x mics)
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"

		# Default capture path (main mic).  WirePlumber probes the capture
		# PCM when it activates the card profile, before any SectionDevice
		# is selected; without a valid TX-macro path that probe fails and
		# the whole profile (speaker included) is discarded.
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC0 MUX' ZERO"

		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='TERT_TDM_RX_0 Audio Mixer MultiMedia1' 0"

		cset "name='RCV DSP1 Preload Switch' 0"
		cset "name='RCV DRE Switch' 0"
		cset "name='RCV PCM Soft Ramp' zero"
		cset "name='RCV Analog PCM Volume' 0"
		cset "name='RCV ASP TX1 Source' zero"
		cset "name='RCV DSP RX1 Source' zero"
		cset "name='RCV DSP RX2 Source' zero"

		cset "name='LCV DSP1 Preload Switch' 0"
		cset "name='LCV DRE Switch' 0"
		cset "name='LCV PCM Soft Ramp' zero"
		cset "name='LCV Analog PCM Volume' 0"
		cset "name='LCV ASP TX1 Source' zero"
		cset "name='LCV DSP RX1 Source' zero"
		cset "name='LCV DSP RX2 Source' zero"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='RCV PCM Source' DSP"
		cset "name='LCV PCM Source' DSP"
	]

	DisableSequence [
		cset "name='RCV PCM Source' zero"
		cset "name='LCV PCM Source' zero"
	]

	Value {
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Digital PCM"
		PlaybackMasterElem "Analog PCM"
		PlaybackVolume "Digital PCM Volume"
	}
}

# Common TX-macro capture setup: DEC0 on AIF1, source = SoundWire ADC.
# Each mic then only changes TX SMIC MUX0 and the codec-side ADC.

SectionDevice."Mic" {
	Comment "Main microphone (bottom, WCD ADC1/AMIC1)"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC0 MUX' ZERO"
	]

	Value {
		CapturePriority 100
		CaptureChannels 1
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Mic Top" {
	Comment "Top microphone (WCD ADC4/AMIC5, INP5)"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 1"
		cset "name='TX3 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX3 MODE' ADC_INVALID"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC0 MUX' ZERO"
	]

	Value {
		CapturePriority 90
		CaptureChannels 1
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Mic Back" {
	Comment "Back microphone (WCD ADC3/AMIC4, INP4)"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC2"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='ADC3 MUX' INP4"
		cset "name='ADC3 Switch' 1"
		cset "name='TX2 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='TX2 MODE' ADC_INVALID"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC0 MUX' ZERO"
	]

	Value {
		CapturePriority 80
		CaptureChannels 1
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Mic Front" {
	Comment "Front microphone (WCD ADC2/AMIC3, INP3)"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2 Switch' 1"
		cset "name='TX1 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='TX1 MODE' ADC_INVALID"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC0 MUX' ZERO"
	]

	Value {
		CapturePriority 70
		CaptureChannels 1
		CapturePCM "hw:${CardId},1"
	}
}
