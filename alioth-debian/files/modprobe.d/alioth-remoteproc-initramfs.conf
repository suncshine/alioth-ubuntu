# Do not auto-load the DSP remoteproc driver from the initramfs.
#
# The adsp/slpi/cdsp firmware (.mbn) lives in the rootfs, not in the initramfs.
# If qcom_q6v5_pas probes before switch_root, request_firmware() fails with
# -ENOENT and all three DSPs stay offline for the rest of the boot (no audio,
# no sensors, hexagonrpcd fails).
#
# This blacklist only blocks alias-based auto-loading (udev/modalias); the
# rootfs's /etc/modules-load.d/alioth.conf loads qcom_q6v5_pas explicitly by
# module name after switch_root, when /lib/firmware is available.
blacklist qcom_q6v5_pas
blacklist qcom_q6v5_mss
blacklist qcom_wcnss_pil
