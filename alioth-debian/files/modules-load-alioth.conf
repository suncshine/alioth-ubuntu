# Modules needed before udev/graphical boot.
# Source: pmaports device-xiaomi-alioth/modules-initfs, plus the touch driver.
#
# panel-samsung-ams667xx01 is deliberately absent: the first-frame-backlight
# production kernel builds the panel driver into Image.gz.  Loading the older
# out-of-tree module from the Kupfer package fails with -EBUSY ("Driver ...
# already registered") and makes systemd-modules-load fail.  When booting an
# older module-based kernel, udev autoloads the panel from the DSI device's OF
# modalias; add the line back only if that proves unreliable.
qcom_common
qcom_pil_info
qcom_q6v5
qcom_q6v5_pas
spi-geni-qcom
ft8756
